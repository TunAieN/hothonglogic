# Payment Vouchers
# =========================

type PaymentAccount {
  id: ID!
  bank_name: String!
  bank_code: String
  account_number: String!
  account_holder: String!
  branch_name: String
  is_default: Boolean!
  is_active: Boolean!
  note: String
  created_at: DateTime
  updated_at: DateTime
}

type PaymentVoucher {
  id: ID!
  voucher_code: String!
  request_uuid: String
  voucher_type: String!
  order_id: ID
  customer_id: ID!
  vn_warehouse_id: ID
  created_by: ID
  payment_method_expected: String
  payment_account_id: ID
  bank_name_snapshot: String
  bank_code_snapshot: String
  bank_account_number_snapshot: String
  bank_account_holder_snapshot: String
  bank_branch_name_snapshot: String
  base_amount_cny: Float!
  exchange_rate: Float
  base_amount_vnd: Float!
  deposit_percent: Float
  currency: String!
  transfer_content: String
  status: String!
  subtotal: Float!
  discount_amount: Float!
  payment_method: String
  paid_at: DateTime
  total_amount: Float!
  deposit_applied: Float!
  customer_credit_applied: Float!
  paid_amount: Float!
  remaining_amount: Float!
  note: String
  cancelled_reason: String
  cancelled_at: DateTime
  expires_at: DateTime
  created_at: DateTime!
  updated_at: DateTime!
  order: Order @belongsTo
  customer: Customer! @belongsTo
  warehouse: VnWarehouse @belongsTo(relation: "warehouse")
  creator: User @belongsTo(relation: "creator")
  paymentAccount: PaymentAccount @belongsTo(relation: "paymentAccount")
  packages: [PaymentVoucherPackage!]! @hasMany
  items: [PaymentVoucherItem!]! @hasMany
  deliveryRequest: DeliveryRequest @hasOne
  transactions: [PaymentTransaction!]! @hasMany
  invoice: Invoice @hasOne
}

type PaymentVoucherItem {
  id: ID!
  payment_voucher_id: ID!
  item_type: String!
  description: String!
  quantity: Float!
  unit_price: Float!
  amount: Float!
  reference_type: String
  reference_id: ID
  created_at: DateTime!
}

type DeliveryRequest {
  id: ID!
  customer_id: ID!
  payment_voucher_id: ID
  order_id: ID
  shipping_task_id: ID
  delivery_method: String!
  preferred_carrier: String
  delivery_note: String
  status: String!
  address: DeliveryAddress @hasOne
  shipments: [Shipment!]! @hasMany
}

type DeliveryAddress {
  id: ID!
  source_customer_address_id: ID
  receiver_name: String!
  receiver_phone: String!
  province_code: String
  province_name: String
  district_code: String
  district_name: String
  ward_code: String
  ward_name: String
  address_line: String
  full_address: String
}

type Shipment {
  id: ID!
  delivery_request_id: ID!
  carrier_code: String!
  service_code: String
  carrier_order_id: String
  tracking_number: String
  shipping_fee: Float!
  cod_amount: Float!
  weight: Float
  length: Float
  width: Float
  height: Float
  status: String!
  label_url: String
  trackingEvents: [ShipmentTrackingEvent!]! @hasMany
}

type ShipmentTrackingEvent {
  id: ID!
  carrier_status: String
  internal_status: String
  description: String
  location: String
  occurred_at: DateTime
}

type PaymentVoucherPackage {
  id: ID!
  payment_voucher_id: ID!
  vn_package_id: ID!
  order_id: ID
  actual_weight: Float!
  volumetric_weight: Float!
  chargeable_weight: Float!
  price_per_kg: Float!
  shipping_rate_id: ID
  shipping_rate_detail_id: ID
  unit_price: Float
  price_type: String
  rate_description: String
  shipping_fee: Float!
  total_amount: Float!
  vnPackage: VnPackage! @belongsTo(relation: "vnPackage")
  order: Order @belongsTo
}

type PaymentTransaction {
  id: ID!
  transaction_code: String!
  payment_voucher_id: ID!
  amount: Float!
  payment_method: String!
  bank_name: String
  bank_transaction_code: String
  received_at: DateTime!
  confirmed_by: ID
  status: String!
  note: String
  proof_image_path: String
  created_at: DateTime!
}

type PaymentVoucherPreview {
  customer: Customer!
  packages: [PaymentVoucherPreviewPackage!]!
  order_total: Float!
  product_total: Float!
  weight_shipping_total: Float!
  delivery_fee_total: Float!
  additional_charge_total: Float!
  gross_total: Float!
  deposit_applied: Float!
  customer_credit_available: Float!
  customer_credit_applied: Float!
  total_amount: Float!
  remaining_amount: Float!
  payment_account: PaymentAccount
  transfer_content: String
}

type PaymentVoucherPreviewPackage {
  id: ID!
  tracking_number: String
  order_id: ID
  order_code: String
  customer_name: String
  actual_weight: Float!
  volumetric_weight: Float!
  chargeable_weight: Float!
  price_per_kg: Float!
  shipping_rate_id: ID
  shipping_rate_detail_id: ID
  unit_price: Float
  price_type: String
  rate_description: String
  shipping_fee: Float!
  additional_charge_amount: Float!
  total_amount: Float!
}

input EligiblePaymentPackageFilterInput {
  search: String
  customer_id: ID
}

input PaymentVoucherFilterInput {
  customer_id: ID
  voucher_code: String
  status: String
  created_by: ID
  created_from: DateTime
  created_to: DateTime
}

input PaymentVoucherAdditionalChargeInput {
  vn_package_id: ID
  surcharge_type: String!
  amount: Float!
  note: String
}

input PreviewPaymentVoucherInput {
  package_ids: [ID!]!
  surcharges: [PaymentVoucherAdditionalChargeInput!]
  delivery_fee: Float
}

input CreatePaymentVoucherInput {
  package_ids: [ID!]!
  request_uuid: String
  vn_warehouse_id: ID
  delivery_method: String!
  customer_address_id: ID
  receiver_name: String
  receiver_phone: String
  province_name: String
  district_name: String
  ward_name: String
  address_line: String
  full_address: String
  preferred_carrier: String
  province_code: String
  district_code: String
  ward_code: String
  delivery_note: String
  delivery_fee: Float
  payment_method_expected: String
  note: String
  surcharges: [PaymentVoucherAdditionalChargeInput!]
}

input ConfirmPaymentTransactionInput {
  amount: Float!
  payment_method: String!
  bank_name: String
  bank_transaction_code: String
  received_at: String
  note: String
  proof_image_path: String
}
