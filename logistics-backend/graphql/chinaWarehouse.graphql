# =========================
# China Warehouse
# =========================

type CnWarehouse {
  id: ID!
  code: String!
  name: String!
  address: String
  status: String!
}

type CnPackage {
  id: ID!
  warehouse_id: ID!
  order_id: ID
  order_tracking_id: ID
  receiver_name: String
  receiver_user_id: ID
  tracking_number: String
  declared_value: Float
  carrier: String
  weight: Float
  actual_length: Float
  actual_width: Float
  actual_height: Float
  volume: Float
  volumetric_weight: Float
  chargeable_weight: Float
  note: String
  status: String!
  package_condition: String
  created_by: ID
  received_at: DateTime
  created_at: DateTime
  warehouse: CnWarehouse! @belongsTo
  order: Order @belongsTo
  order_tracking: OrderTracking @belongsTo(relation: "orderTracking")
  receiver: User @belongsTo
  current_batch_package: CnBatchPackage @hasOne(relation: "currentBatchPackage")
  batch_packages: [CnBatchPackage!]! @hasMany(relation: "batchPackages")
  batches: [CnBatch!]! @belongsToMany
  package_items: [CnPackageItem!]! @hasMany(relation: "packageItems")
}

type CnPackageItem {
  id: ID!
  cn_package_id: ID!
  order_item_id: ID!
  quantity: Int!
  order_item: OrderItem! @belongsTo(relation: "orderItem")
}

input CreateCnPackageInput {
    expected_tracking_id: ID
    expected_order_id: ID
    warehouse_id: ID!
    warehouse_code: String
    warehouse_name: String
    receiver_name: String
    receiver_user_id: ID!
    tracking_number: String!
    declared_value: Float
    carrier: String
    weight: Float!
    actual_length: Float
    actual_width: Float
    actual_height: Float
    volume: Float
    volumetric_weight: Float
    chargeable_weight: Float
    note: String
    status: String!
    package_condition: String
    received_at: DateTime!
}

input UpdateCnPackageInput {
    reconciliation: CnPackageReconciliationInput
    warehouse_id: ID
    warehouse_code: String
    warehouse_name: String
    receiver_name: String
    receiver_user_id: ID
    tracking_number: String
    declared_value: Float
    carrier: String
    weight: Float
    actual_length: Float
    actual_width: Float
    actual_height: Float
    volume: Float
    volumetric_weight: Float
    chargeable_weight: Float
    note: String
    status: String
    package_condition: String
    received_at: DateTime
}

input CnPackageReconciliationInput {
  original_tracking_number: String
  original_note: String
  verified_tracking_number: String
  reason: String!
  note: String
}

type CnPackageReconciliationOrder {
  id: ID!
  order_code: String!
  customer_name: String
  tracking_numbers: [String!]!
  purchases: [CnExpectedInboundPurchaseOrder!]!
}

type CnTrackingPurchaseItem {
  order_item_id: ID
  name: String
  variant: String!
  quantity: Int!
}

type CnTrackingPurchaseOption {
  id: ID!
  code: String!
  shop: String
  tracking_numbers: [String!]!
  items: [CnTrackingPurchaseItem!]!
}

type CnTrackingPurchaseVerification {
  tracking_number: String!
  tracking_status: String!
  order_code: String!
  purchase_ids: [ID!]!
  purchases: [CnTrackingPurchaseOption!]!
  inspected_items: [CnTrackingPurchaseItem!]!
}

input CnTrackingPurchaseVerificationInput {
  package_id: ID!
  tracking_id: ID!
  purchase_ids: [ID!]!
  expected_purchase_ids: [ID!]!
  reason: String!
  add_only: Boolean = false
}

type CnPackageInspectionQuantity {
  order_item_id: ID!
  checked_elsewhere: Int!
  remaining: Int!
}

type CnPackageInspectionReview {
  quantities: [CnPackageInspectionQuantity!]!
  status: String!
  ambiguous: Boolean!
  purchase_ids: [ID!]!
  candidates: [CnTrackingPurchaseOption!]!
  linked_purchases: [CnTrackingPurchaseOption!]!
}

type CnTrackingPurchaseVerificationResult {
  purchase_ids: [ID!]!
}

type CnWarehouseReceiverOption {
  id: ID!
  name: String!
  email: String!
  phone: String
  department: String
  status: String!
  role: Role
}

type CnPackageTrackingValidation {
  valid: Boolean!
  message: String
  code: String
  matched: Boolean!
  existing_package_id: ID
  order_code: String
  purchase_orders: [CnExpectedInboundPurchaseOrder!]
}

type CnReceivingOptions {
  warehouses: [CnWarehouse!]!
  receivers: [CnWarehouseReceiverOption!]!
}

input CnExpectedInboundFilterInput {
  search: String
  shop: String
}

type CnExpectedInboundCustomer {
  id: ID!
  code: String
  name: String!
}

type CnExpectedInboundOrder {
  id: ID!
  order_code: String!
  customer: CnExpectedInboundCustomer
}

type CnExpectedInboundPurchaseOrder {
  id: ID!
  external_order_code: String!
  shop_name: String
}

type CnExpectedInboundProduct {
  id: ID!
  name: String!
  image: String
  sku: String
  quantity: Int!
}

type CnExpectedInboundProductSummary {
  allocated: Boolean!
  sku_count: Int!
  total_quantity: Int!
}

type CnExpectedInboundRow {
  id: ID!
  tracking_number: String!
  display_status: String!
  can_receive: Boolean!
  order: CnExpectedInboundOrder
  purchase_orders: [CnExpectedInboundPurchaseOrder!]!
  products: [CnExpectedInboundProduct!]!
  product_summary: CnExpectedInboundProductSummary!
  warehouse: CnWarehouse
}

type CnExpectedInboundSummary {
  tracking_count: Int!
  order_count: Int!
  customer_count: Int!
}

type CnExpectedInboundPaginatorInfo {
  currentPage: Int!
  lastPage: Int!
  perPage: Int!
  total: Int!
  firstItem: Int
  lastItem: Int
  hasMorePages: Boolean!
}

type CnExpectedInboundConnection {
  data: [CnExpectedInboundRow!]!
  paginatorInfo: CnExpectedInboundPaginatorInfo!
  summary: CnExpectedInboundSummary!
  shops: [String!]!
}

# =========================
# China Batches
# =========================

type CnBatch {
  id: ID!
  batch_code: String!
  warehouse_id: ID!
  destination_warehouse_name: String
  destination_warehouse_id: ID
  destination_warehouse: VnWarehouse @belongsTo(relation: "destinationWarehouse")
  total_packages: Int
  status: String!
  shipping_type: String!
  packaging_type: String
  transport_container_count: Int
  departed_at: DateTime
  expected_arrival_at: DateTime
  arrived_at: DateTime
  total_weight: Float
  actual_batch_weight: Float
  package_material_weight: Float
  actual_length: Float
  actual_width: Float
  actual_height: Float
  actual_volume: Float
  carrier_name: String
  transport_code: String
  route_name: String
  vehicle_plate: String
  driver_name: String
  driver_phone: String
  freight_cost: Float
  handed_over_by: ID
  handed_over_at: DateTime
  dispatch_note: String
  note: String
  created_at: DateTime!
  updated_at: DateTime!
  warehouse: CnWarehouse! @belongsTo
  batch_packages: [CnBatchPackage!]! @hasMany(relation: "batchPackages")
  packages: [CnPackage!]! @belongsToMany
  vn_batch_receipt: VnBatchReceipt @hasOne(relation: "vnBatchReceipt")
}

type CnBatchPackage {
  id: ID!
  cn_batch_id: ID!
  cn_package_id: ID!
  created_at: DateTime!
  updated_at: DateTime!
  batch: CnBatch! @belongsTo(relation: "batch")
  package: CnPackage! @belongsTo(relation: "package")
}

input AddPackagesToCnBatchInput {
    cn_batch_id: ID
    cn_package_ids: [ID!]!
    destination_warehouse_id: ID
    shipping_type: String
    expected_arrival_at: DateTime
    note: String
}

type CnBatchReceivingOptions {
  preview_code: String!
  destinations: [VnWarehouse!]!
}

input UpdateCnBatchInput {
    destination_warehouse_name: String
    shipping_type: String
    departed_at: DateTime
    expected_arrival_at: DateTime
    arrived_at: DateTime
    note: String
    status: String
    freight_cost: Float
    packages: [UpdateCnBatchPackageInput!]
}

input UpdateCnBatchPackageInput {
    id: ID
    tracking_number: String!
    weight: Float!
    actual_length: Float
    actual_width: Float
    actual_height: Float
}

type CnBatchDispatchPackageReview {
    id: ID!
    issues: [String!]!
    warnings: [String!]!
}

type CnBatchDispatchReview {
    version: String!
    destination_ready: Boolean!
    issues: [String!]!
    packages: [CnBatchDispatchPackageReview!]!
    destinations: [VnWarehouse!]!
}

input DispatchCnBatchInput {
    reviewed_package_ids: [ID!]!
    review_version: String!
    review_confirmed: Boolean!
    destination_warehouse_id: ID!
    shipping_type: String!
    packaging_type: String!
    transport_container_count: Int!
    actual_batch_weight: Float!
    package_material_weight: Float
    actual_length: Float!
    actual_width: Float!
    actual_height: Float!
    carrier_name: String!
    transport_code: String
    route_name: String
    vehicle_plate: String
    driver_name: String
    driver_phone: String
    freight_cost: Float
    departed_at: DateTime!
    expected_arrival_at: DateTime!
    dispatch_note: String
}

input CreateVietnamInboundTaskInput {
    cn_batch_ids: [ID!]!
}

type VietnamInboundTaskPayload {
  batch_ids: [ID!]!
  total_batches: Int!
  total_packages: Int!
  total_weight: Float!
  batches: [CnBatch!]!
}
