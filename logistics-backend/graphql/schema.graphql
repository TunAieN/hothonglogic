scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

# =========================
# Root Query
# =========================

type Query {
  # =========================
  # Auth / Users / Roles
  # =========================

  user(
    id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])
    email: String @eq @rules(apply: ["prohibits:id", "required_without:id", "email"])
  ): User @find
  users(
    name: String @where(operator: "like")
  ): [User!]! @paginate(defaultCount: 10)
  employees(filter: EmployeeFilterInput): [User!]!
    @guard(with: ["api"])
    @paginate(defaultCount: 10, builder: "App\\GraphQL\\Resolvers\\EmployeeResolver@list")
  employee(id: ID!): User
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\EmployeeResolver@show")
  roles: [Role!]!
    @guard(with: ["api"])
    @all(model: "App\\Models\\Role")
  me: User
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\AuthResolver@me")

  # =========================
  # Customers
  # =========================

  customers(filter: CustomerFilterInput): [Customer!]!
    @paginate(defaultCount: 10, builder: "App\\GraphQL\\Resolvers\\CustomerResolver@list")
  customer(id: ID!): Customer
    @field(resolver: "App\\GraphQL\\Resolvers\\CustomerResolver@show")

  # =========================
  # Orders
  # =========================

  orders(filter: OrderFilterInput): [Order!]!
    @paginate(defaultCount: 10, builder: "App\\GraphQL\\Resolvers\\OrderResolver@list")
  order(id: ID! @eq): Order @find

  # =========================
  # China Warehouse
  # =========================

  cnPackages: [CnPackage!]!
    @guard(with: ["api"])
    @paginate(defaultCount: 50, builder: "App\\GraphQL\\Resolvers\\CnPackageResolver@list")
  cnPackage(id: ID!): CnPackage
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\CnPackageResolver@show")

  # =========================
  # China Batches
  # =========================

  cnBatches: [CnBatch!]!
    @guard(with: ["api"])
    @paginate(defaultCount: 20, builder: "App\\GraphQL\\Resolvers\\CnBatchResolver@list")
  cnBatch(id: ID!): CnBatch
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\CnBatchResolver@show")
  cnBatchByCode(batch_code: String!): CnBatch
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\VietnamWarehouseResolver@cnBatchByCode")

  # =========================
  # Vietnam Warehouse
  # =========================

  vietnamWarehouseReceipt(batch_code: String!): VietnamWarehouseReceiptPayload!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\VietnamWarehouseResolver@vietnamWarehouseReceipt")

  # =========================
  # Payment Vouchers
  # =========================

  eligiblePaymentPackages(filter: EligiblePaymentPackageFilterInput): [VnPackage!]!
    @guard(with: ["api"])
    @paginate(defaultCount: 20, builder: "App\\GraphQL\\Resolvers\\PaymentVoucherResolver@eligiblePackages")
  previewPaymentVoucher(input: PreviewPaymentVoucherInput!): PaymentVoucherPreview!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\PaymentVoucherResolver@preview")
  defaultPaymentAccount: PaymentAccount
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\PaymentVoucherResolver@defaultPaymentAccount")
  paymentVouchers(filter: PaymentVoucherFilterInput): [PaymentVoucher!]!
    @guard(with: ["api"])
    @paginate(defaultCount: 20, builder: "App\\GraphQL\\Resolvers\\PaymentVoucherResolver@list")
  paymentVoucher(id: ID!): PaymentVoucher
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\PaymentVoucherResolver@show")
  paymentVoucherTransactions(payment_voucher_id: ID!): [PaymentTransaction!]!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\PaymentVoucherResolver@transactions")
  paymentVoucherInvoice(payment_voucher_id: ID!): Invoice
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\PaymentVoucherResolver@invoice")
  paymentVoucherAuditLogs(payment_voucher_id: ID!): [AuditLog!]!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\PaymentVoucherResolver@auditLogs")

  shippingRates(filter: ShippingRateFilterInput): [ShippingRate!]!
    @guard(with: ["api"])
    @paginate(defaultCount: 20, builder: "App\\GraphQL\\Resolvers\\ShippingRateResolver@list")
  shippingRate(id: ID!): ShippingRate
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\ShippingRateResolver@show")
  activeShippingRate(input: ActiveShippingRateInput): ShippingRate
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\ShippingRateResolver@active")
  calculateShippingFee(input: CalculateShippingFeeInput!): ShippingFeeCalculation!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\ShippingRateResolver@calculate")
}

# =========================
# Root Mutation
# =========================

type Mutation {
  # =========================
  # Auth
  # =========================

  login(
    email: String!
    password: String!
  ): AuthPayload
    @field(resolver: "App\\GraphQL\\Resolvers\\LoginResolver@login")

  # =========================
  # Customers
  # =========================

  createCustomer(input: CreateCustomerInput! @spread): Customer
    @field(resolver: "App\\GraphQL\\Resolvers\\CustomerResolver@create")
  updateCustomer(id: ID!, input: UpdateCustomerInput! @spread): Customer
    @field(resolver: "App\\GraphQL\\Resolvers\\CustomerResolver@update")
  deleteCustomer(id: ID!): Customer
    @field(resolver: "App\\GraphQL\\Resolvers\\CustomerResolver@delete")

  # =========================
  # Employees
  # =========================

  createEmployee(input: CreateEmployeeInput! @spread): User
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\EmployeeResolver@create")
  updateEmployee(id: ID!, input: UpdateEmployeeInput! @spread): User
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\EmployeeResolver@update")
  deleteEmployee(id: ID!): User
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\EmployeeResolver@delete")

  # =========================
  # Orders
  # =========================

  createOrder(input: CreateOrderInput!): Order
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\OrderResolver@create")
  updateOrder(id: ID!, input: UpdateOrderInput!): Order
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\OrderResolver@update")
  deleteOrder(id: ID!): Order
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\OrderResolver@delete")
  mockReceiveAtGuangzhouWarehouse(package_id: ID!): MockReceivePackagePayload!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\OrderResolver@mockReceiveAtGuangzhouWarehouse")
  createPackagesByShop(order_id: ID!): Order!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\OrderResolver@createPackagesByShop")

  # =========================
  # China Warehouse
  # =========================

  createCnPackage(input: CreateCnPackageInput!): CnPackage
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\CnPackageResolver@create")
  updateCnPackage(id: ID!, input: UpdateCnPackageInput!): CnPackage
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\CnPackageResolver@update")
  confirmCnPackageItems(package_id: ID!, items: [OrderPackageItemInput!]!): CnPackage
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\CnPackageResolver@confirmItems")
  deleteCnPackage(id: ID!): CnPackage
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\CnPackageResolver@delete")

  # =========================
  # China Batches
  # =========================

  addPackagesToCnBatch(input: AddPackagesToCnBatchInput!): CnBatch!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\CnBatchResolver@addPackages")
  updateCnBatch(id: ID!, input: UpdateCnBatchInput!): CnBatch!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\CnBatchResolver@update")
  deleteCnBatch(id: ID!): CnBatch!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\CnBatchResolver@delete")
  createVietnamInboundTask(input: CreateVietnamInboundTaskInput!): VietnamInboundTaskPayload!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\CnBatchResolver@createVietnamInboundTask")

  # =========================
  # Vietnam Warehouse
  # =========================

  startVietnamWarehouseReceipt(input: StartVietnamWarehouseReceiptInput!): VnBatchReceipt!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\VietnamWarehouseResolver@startVietnamWarehouseReceipt")
  scanVietnamPackage(input: ScanVietnamPackageInput!): VietnamWarehouseReceiptPayload!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\VietnamWarehouseResolver@scanVietnamPackage")
  removeVietnamPackage(id: ID!): VietnamWarehouseReceiptPayload!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\VietnamWarehouseResolver@removeVietnamPackage")
  moveVietnamWarehouseReceiptToErrorQueue(receipt_id: ID!): VnBatchReceipt!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\VietnamWarehouseResolver@moveVietnamWarehouseReceiptToErrorQueue")
  confirmVietnamWarehouseReceipt(receipt_id: ID!): VnBatchReceipt!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\VietnamWarehouseResolver@confirmVietnamWarehouseReceipt")

  # =========================
  # Payment Vouchers
  # =========================

  createPaymentVoucher(input: CreatePaymentVoucherInput!): PaymentVoucher!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\PaymentVoucherResolver@create")
  cancelPaymentVoucher(id: ID!, reason: String!): PaymentVoucher!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\PaymentVoucherResolver@cancel")
  confirmPaymentTransaction(payment_voucher_id: ID!, input: ConfirmPaymentTransactionInput!): PaymentVoucher!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\PaymentVoucherResolver@confirmTransaction")
  issuePaymentVoucherInvoice(payment_voucher_id: ID!): Invoice!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\PaymentVoucherResolver@issueInvoice")
  createShippingRate(input: ShippingRateInput!): ShippingRate!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\ShippingRateResolver@create")
  updateShippingRate(id: ID!, input: ShippingRateInput!): ShippingRate!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\ShippingRateResolver@update")
  deactivateShippingRate(id: ID!): ShippingRate!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\ShippingRateResolver@deactivate")
  createShippingRateDetail(shipping_rate_id: ID!, input: ShippingRateDetailInput!): ShippingRateDetail!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\ShippingRateResolver@createDetail")
  updateShippingRateDetail(id: ID!, input: ShippingRateDetailInput!): ShippingRateDetail!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\ShippingRateResolver@updateDetail")
  deleteShippingRateDetail(id: ID!): Boolean!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\ShippingRateResolver@deleteDetail")
}

# =========================
# Auth / Users / Roles / Employees
# =========================

type AuthPayload {
  access_token: String!
  token_type: String!
  user: User!
}

type User {
  id: ID!
  name: String!
  email: String!
  role_id: ID
  role: Role @belongsTo
  phone: String
  address: String
  status: String
  email_verified_at: DateTime
  created_at: DateTime!
  updated_at: DateTime!
}

type Role {
  id: ID!
  name: String!
  permissions: [String!]
  created_at: DateTime
  updated_at: DateTime
}

input EmployeeFilterInput {
  search: String
  role_id: ID
  status: String
  created_from: DateTime
  created_to: DateTime
}

input CreateEmployeeInput {
  name: String!
  email: String!
  password: String!
  role_id: ID!
  phone: String
  address: String
  status: String
}

input UpdateEmployeeInput {
  name: String!
  email: String!
  password: String
  role_id: ID!
  phone: String
  address: String
  status: String!
}

