# =========================
# Customers
# =========================

type Customer {
  id: ID!
  code: String!
  name: String!
  vip_group: String
  phone: String!
  email: String
  province: String
  district: String
  ward: String
  address: String
  note: String
  status: String
  created_at: DateTime
  orders: [Order!]!
  orders_count: Int!
  addresses: [CustomerAddress!]! @hasMany
}

type CustomerAddress {
  id: ID!
  customer_id: ID!
  label: String
  receiver_name: String!
  receiver_phone: String!
  province_code: String
  province_name: String
  district_code: String
  district_name: String
  ward_code: String
  ward_name: String
  address_line: String
  full_address: String
  is_default: Boolean!
  created_at: DateTime
  updated_at: DateTime
}

input CustomerAddressInput {
  customer_id: ID!
  label: String
  receiver_name: String!
  receiver_phone: String!
  province_code: String!
  province_name: String!
  district_code: String!
  district_name: String!
  ward_code: String!
  ward_name: String!
  address_line: String!
  is_default: Boolean = false
}

input CustomerFilterInput {
  search: String
  status: String
  vip_group: String
  province: String
  phone: String
  created_from: DateTime
  created_to: DateTime
}

input CreateCustomerInput {
  name: String!
  vip_group: String
  phone: String!
  email: String
  province: String
  district: String
  ward: String
  address: String
  note: String
}

input UpdateCustomerInput {
  code: String!
  name: String!
  vip_group: String
  phone: String!
  email: String
  province: String
  district: String
  ward: String
  address: String
  note: String
  status: String
}
