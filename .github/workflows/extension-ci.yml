name: Extension CI

on:
  push:
    paths:
      - "extension-src/**"
      - "scripts/validate-extension.mjs"
      - "docs/setup/extension.md"
      - ".github/workflows/extension-ci.yml"
  pull_request:
    paths:
      - "extension-src/**"
      - "scripts/validate-extension.mjs"
      - "docs/setup/extension.md"
      - ".github/workflows/extension-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find extension-src -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Validate manifest references and icons
        run: node scripts/validate-extension.mjs
