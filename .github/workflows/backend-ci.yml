name: Backend CI

on:
  push:
    paths:
      - "logistics-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "logistics-backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logistics-backend
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: hothonglogic_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      LIGHTHOUSE_SCHEMA_CACHE_ENABLE: "false"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: hothonglogic_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Prepare database
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test

      - name: Check code style
        run: ./vendor/bin/pint --test
